/* ===== ERP 1.18.10.73 · Pulido visual Programa de Mantención ===== */
.maint-modern-shell{border:1px solid #dbe9ef;border-radius:22px;background:linear-gradient(180deg,#ffffff 0%,#fbfdff 100%);overflow:hidden;box-shadow:0 12px 30px rgba(16,61,94,.06)}
.maint-modern-head{padding:18px 20px 16px;border-bottom:1px solid #e4eef3;background:linear-gradient(135deg,#f7fcff 0%,#f3fbfd 55%,#ffffff 100%)}
.maint-toolbar{gap:9px}.maint-year-switch{display:inline-flex;align-items:center;gap:6px;padding:4px;border:1px solid #d4e6ee;border-radius:15px;background:#fff;box-shadow:0 4px 12px rgba(16,61,94,.05)}
.maint-year-switch .secondary{width:38px;height:38px;padding:0;border-radius:11px;font-size:20px}.maint-year-label{min-width:72px;text-align:center;font-size:15px;font-weight:950;color:var(--brand-dark);letter-spacing:.03em}
.maint-download{display:inline-flex;align-items:center;gap:8px}.maint-download svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.maint-summary{gap:10px;margin:16px 0 12px}.maint-summary-card{position:relative;overflow:hidden;border-radius:18px;padding:15px 16px 14px;background:linear-gradient(145deg,#fff,#fbfdff);box-shadow:0 8px 20px rgba(16,61,94,.045)}
.maint-summary-card:after{content:'';position:absolute;width:52px;height:52px;border-radius:50%;right:-18px;top:-18px;background:#eaf8fc}.maint-summary-card.done:after{background:#e7fbf3}.maint-summary-card.late:after{background:#fff0f1}.maint-summary-card strong{font-size:24px}
.maint-legend{margin-top:12px;padding:9px 11px;border-radius:13px;background:rgba(255,255,255,.72);border:1px solid #e5eef2;width:max-content;max-width:100%}
.maint-table-shell{padding:0 0 4px;background:#fff}.maint-grid{min-width:1240px}.maint-grid thead th{position:sticky;top:0;z-index:3;background:#eff9fc;color:#174963;font-size:10px;font-weight:950;letter-spacing:.045em;text-transform:uppercase;border-bottom:1px solid #cfe4ec;padding:11px 8px}
.maint-grid thead th:first-child{z-index:5;background:#eaf7fb}.maint-grid tbody tr{transition:.12s ease}.maint-grid tbody tr:hover td{background:#fbfeff}.maint-grid tbody tr:hover td:first-child{background:#f5fbfd}
.maint-grid td{height:62px}.maint-grid td:first-child{background:#fff;border-right:1px solid #dceaf0;padding:12px 14px;box-shadow:4px 0 10px rgba(16,61,94,.025)}
.maint-grid .main-text{font-size:13px;font-weight:900}.maint-grid .small{margin-top:3px;line-height:1.25;color:#678094}.maint-program-meta{margin-top:7px}
.maint-chip{padding:4px 8px;background:#f5fafc;border-color:#d8e8ef;font-size:9px}.maint-cell-btn{width:38px;height:38px;display:inline-grid;place-items:center}.maint-dot{width:34px;height:34px;border-radius:11px;font-size:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.maint-actions{gap:7px}.maint-action-btn{border:1px solid #d5e6ee;background:#fff;color:var(--brand-dark);border-radius:11px;padding:7px 10px;font-size:10px;font-weight:900;cursor:pointer;transition:.14s ease}.maint-action-btn:hover{background:#f2fbfe;border-color:#b9dce7;transform:translateY(-1px)}
.maint-empty-note{padding:26px!important;color:#72889a!important}
@media(max-width:900px){.maint-modern-head{padding:14px}.maint-year-switch{order:0}.maint-download{width:auto}}


/* ===== ERP 1.18.10.73 · accesos, PDFs y acciones rápidas ===== */
button{touch-action:manipulation}
.nav button.external-link{color:#31566d}.nav button.external-link:hover{background:#eef8fb;color:#087f9b}
.nav-tools{display:grid;gap:6px;margin-top:3px}
.nav-tools-toggle{width:100%;position:relative}
.nav-tools-toggle .tools-chevron{margin-left:auto;width:18px;height:18px;display:grid;place-items:center;color:#7890a2;transition:transform .2s ease}
.nav-tools-toggle .tools-chevron svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-tools.open .nav-tools-toggle{background:#f4fafc;color:var(--brand-dark)}
.nav-tools.open .nav-tools-toggle .tools-chevron{transform:rotate(180deg)}
.nav-tools.has-active .nav-tools-toggle{color:var(--brand-dark);background:linear-gradient(90deg,rgba(36,199,216,.08),rgba(70,166,241,.08))}
.nav-tools-menu{display:none;margin-left:13px;padding-left:10px;border-left:1px solid #d8e9f0;gap:5px}
.nav-tools.open .nav-tools-menu{display:grid}
.nav-tools-menu button{padding:8px 9px;border-radius:12px;gap:10px;font-size:13px}
.nav-tools-menu .ico{width:30px;height:30px;flex-basis:30px;border-radius:9px}
.nav-tools-menu .ico svg{width:16px;height:16px}
#app.sidebar-collapsed .nav-tools-menu{margin-left:0;padding-left:0;border-left:0}
#app.sidebar-collapsed .nav-tools-toggle .tools-chevron{display:none}
#app.sidebar-collapsed .nav-tools-menu button{justify-content:center;padding-left:8px;padding-right:8px}

.account-action{width:100%;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.admin-users-layout{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:18px;align-items:start}
.admin-users-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 28px rgba(16,61,94,.04)}
.admin-users-card h3{margin:0 0 4px;color:var(--brand-dark);font-size:18px}.admin-users-card .small{line-height:1.45}
.admin-user-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}.admin-user-row{border:1px solid #dce8ed;border-radius:15px;padding:13px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:#fff}
.admin-user-main strong{display:block;color:var(--brand-dark);font-size:14px}.admin-user-main .small{margin-top:3px}.admin-user-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.admin-chip{display:inline-flex;align-items:center;border:1px solid #d7e5eb;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900;background:#f8fbfc;color:#476277}.admin-chip.on{background:#ecfdf5;border-color:#a7f3d0;color:#087d6c}.admin-chip.off{background:#fff1f2;border-color:#fecdd3;color:#b42318}.admin-chip.role{background:#eef7ff;border-color:#cfe4ff;color:#155e9c}
.admin-user-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}.admin-user-actions button{border:1px solid #d6e4ea;background:#fff;border-radius:10px;padding:7px 9px;font-size:11px;font-weight:850;color:#234b63;cursor:pointer}.admin-user-actions button:hover{background:#f2fbfe}.admin-user-actions .danger-mini{color:#b42318;border-color:#fecdd3;background:#fff7f7}
.pdf-center-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.pdf-center-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px}.pdf-center-card h3{margin:0;color:var(--brand-dark);font-size:18px}.pdf-center-card p{margin:0;color:var(--muted);line-height:1.5}.pdf-center-card .primary,.pdf-center-card .secondary{align-self:flex-start}
.quick-action:active,.icon-circle-btn:active,.billing-act:active,.ot-option-btn:active,.maint-action-btn:active{transform:translateY(1px) scale(.98)}
button[disabled]{cursor:wait;opacity:.66;pointer-events:none}
.password-help{padding:11px 13px;border-radius:13px;background:#f6fafc;border:1px solid #dbe9ef;color:#597287;font-size:12px;line-height:1.45;margin-bottom:14px}
@media(max-width:900px){.admin-users-layout,.pdf-center-grid{grid-template-columns:1fr}.admin-user-row{grid-template-columns:1fr}.admin-user-actions{justify-content:flex-start}}


/* ===== ERP 1.18.10.73 · Facturación estilo CRM anterior ===== */
.billing-table.crm-old{min-width:1280px}
.billing-table.crm-old th{white-space:nowrap}
.billing-table.crm-old tbody tr.billing-row-paid td{background:#fff;border-bottom-color:#bfeee2}
.billing-table.crm-old tbody tr.billing-row-paid td:first-child{box-shadow:inset 5px 0 0 #22c97a}
.billing-table.crm-old tbody tr.billing-row-paid:hover td{background:#fbfffd}
.billing-table.crm-old tbody tr.billing-row-pending td{background:#fff0f0;border-bottom-color:#f3c8c8}
.billing-table.crm-old tbody tr.billing-row-pending td:first-child{box-shadow:inset 5px 0 0 #ef4444}
.billing-table.crm-old tbody tr.billing-row-pending:hover td{background:#ffe9e9}
.billing-table.crm-old .billing-work-main{font-weight:900;color:#07172b;line-height:1.15}
.billing-table.crm-old .billing-work-sub{font-size:12px;color:#445b6f;line-height:1.25;margin-top:2px}
.billing-table.crm-old .billing-invoice-no{display:inline-flex;align-items:center;gap:7px;font-weight:900;color:#07172b}
.billing-table.crm-old .billing-invoice-no svg{width:15px;height:15px;stroke:#526b7e;fill:none;stroke-width:1.9}
.billing-table.crm-old .billing-paid-cell{font-weight:900;color:#07172b;white-space:nowrap}
.billing-status-mini{margin-top:4px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.03em}
.billing-status-mini.paid{color:#07845f}
.billing-status-mini.pending{color:#c62828}
.billing-status-mini.cancelled{color:#64748b}

.quote-action-busy{pointer-events:none!important;opacity:.72!important;position:relative}
.quote-action-busy::after{content:'';position:absolute;inset:50% auto auto 50%;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border:2px solid rgba(16,61,94,.22);border-top-color:#103d5e;border-radius:50%;animation:spin .7s linear infinite}
.quote-action-busy svg,.quote-action-busy span{opacity:.22}
</style>

function quoteMoneyInput(el){if(!el)return;const digits=String(el.value??'').replace(/\D/g,'');el.value=digits?Number(digits).toLocaleString('es-CL'):'';recalcQuoteForm()}
function otMoneyBreakdown(totalValue){const total=Math.max(0,parseQuoteMoney(totalValue));const neto=total?Math.round(total/1.19):0;const iva=Math.max(0,total-neto);return {total,neto,iva}}
function otMoneyFormat(el){if(!el)return 0;const digits=String(el.value??'').replace(/\D/g,'');const value=digits?Number(digits):0;el.value=digits?value.toLocaleString('es-CL'):'';return value}
function otRecalcMoney(source='total'){const totalInput=$('otAmountTotal'),netInput=$('otAmountNet'),ivaInput=$('otAmountIva'),sourceInput=$('otMoneySource');let total=0,neto=0,iva=0;if(source==='net'){neto=Math.max(0,parseQuoteMoney(netInput?.value));iva=Math.round(neto*.19);total=neto+iva;if(totalInput)totalInput.value=total?total.toLocaleString('es-CL'):''}else{total=Math.max(0,parseQuoteMoney(totalInput?.value));neto=total?Math.round(total/1.19):0;iva=Math.max(0,total-neto);if(netInput)netInput.value=neto?neto.toLocaleString('es-CL'):''}if(ivaInput)ivaInput.value=iva?iva.toLocaleString('es-CL'):'';if(sourceInput)sourceInput.value=source;return {total,neto,iva}}
function otMoneyTotalInput(el){otMoneyFormat(el);otRecalcMoney('total')}

      const k=localStorage.key(i);
      if(!k||!k.startsWith(QUOTE_VIEW_CACHE_PREFIX))continue;
      const rawKey=k.slice(QUOTE_VIEW_CACHE_PREFIX.length);

    ERP.store.quotes=[...map.values()];
    rebuildMaps();
  }

  return localQuotePreview(q,wantedStatus);

async function hydrateVisibleOTData(rows){
  const ids=[...new Set((rows||[]).map(o=>String(o?.id||'')).filter(Boolean))];
  if(!ids.length)return rows||[];

  const need=ids.filter(id=>{
    const d=ERP.store.otDetails.get(String(id));
    return !d?.data;
  });

  if(need.length){
    for(let i=0;i<need.length;i+=30){
      const chunk=need.slice(i,i+30);
      try{
        const j=await api('select',{
          table:'ots',
          columns:['id','client_id','quote_id','data'],
          filters:[{column:'id',op:'in',value:chunk}],
          orGroups:[],
          order:null,
          offset:0,
          limit:null,
          resolveOverflow:false
        },{timeout:25000,attempts:2});

        for(const raw of (j.data||[])){
          if(!raw?.id)continue;
          const key=String(raw.id);
          const previous=ERP.store.otDetails.get(key)||localOTRaw(key)||{id:raw.id};
          const merged={...previous,...raw,data:raw.data||previous.data||null};
          ERP.store.otDetails.set(key,merged);

          const pos=ERP.store.ots.findIndex(o=>String(o.id)===key);
          if(pos>=0)ERP.store.ots[pos]=normalizeOT({...ERP.store.ots[pos],...raw,data:raw.data||ERP.store.ots[pos].data});

          const ri=(ERP.remote.ots.currentRows||[]).findIndex(o=>String(o.id)===key);
          if(ri>=0)ERP.remote.ots.currentRows[ri]=normalizeOT({...ERP.remote.ots.currentRows[ri],...raw,data:raw.data||ERP.remote.ots.currentRows[ri].data});
        }
      }catch(e){}
    }
  }

  return (ERP.remote.ots.currentRows||rows||[]).map(o=>{
    const full=ERP.store.otDetails.get(String(o.id));
    return full?normalizeOT({...o,...full,data:full.data||o.data}):o;
  });
}

async function hydrateOTChunkForClassification(rows,signal=null){
  const ids=[...new Set((rows||[]).map(o=>String(o?.id||'')).filter(Boolean))];
  if(!ids.length)return rows||[];

  try{
    const j=await api('select',{
      table:'ots',
      columns:OT_DETAIL_COLUMNS,
      filters:[{column:'id',op:'in',value:ids}],
      orGroups:[],
      order:null,
      offset:0,
      limit:null,
      resolveOverflow:true
    },{timeout:30000,attempts:2,signal});

    const byId=new Map();
    for(const raw of (j.data||[])){
      if(!raw?.id)continue;
      const key=String(raw.id);
      const normalized=normalizeOT(raw);
      byId.set(key,normalized);
      ERP.store.otDetails.set(key,raw);

      const pos=ERP.store.ots.findIndex(o=>String(o.id)===key);
      if(pos>=0){
        ERP.store.ots[pos]=normalizeOT({
          ...ERP.store.ots[pos],
          ...raw,
          data:raw.data||ERP.store.ots[pos].data
        });
      }
    }

    return (rows||[]).map(o=>{
      const full=byId.get(String(o.id));
      return full
        ? normalizeOT({...o,...full,data:full.data||o.data})
        : o;
    });

    if(isAbortError(e))throw e;
    return rows||[];
  }

const OT_BILLING_REQ_CHECKED=new Set();
const OT_BILLING_REQ_FAILED=new Set();

async function ensureOTBillingRequirements(rows,signal=null){
  const ids=[...new Set((rows||[]).map(o=>String(o?.clientId||'')).filter(Boolean))];

  // Para facturación no basta con clientFor(): puede ser una copia liviana
  // que tenga nombre/RUT pero no la configuración OC/HES.
  const missing=ids.filter(id=>{
    const raw=ERP.store.clientDetails.get(id);
    if(!raw)return !OT_BILLING_REQ_CHECKED.has(id);
    const hasResolvedData=!!(
      raw.data &&
      typeof raw.data==='object' &&
      !raw.data.__drive_ref
    );
    return !hasResolvedData && !OT_BILLING_REQ_CHECKED.has(id);
  });

  if(!missing.length)return;

  for(let i=0;i<missing.length;i+=25){
    const chunk=missing.slice(i,i+25);
    if(signal?.aborted)throw abortError();

    let loadedRows=[];

    // Intento 1: select por lote resolviendo data/overflow.
    try{
      const j=await api('select',{
        table:'clients',
        columns:['id','name','rut','data'],
        filters:[{column:'id',op:'in',value:chunk}],
        orGroups:[],
        order:{column:'name',ascending:true},
        offset:0,
        limit:null,
        resolveOverflow:true
      },{timeout:30000,attempts:2,signal});

      loadedRows=Array.isArray(j?.data)?j.data:[];
    }catch(e){
      if(isAbortError(e))throw e;
    }

    // Detectar registros que llegaron sin data completa.
    const byId=new Map(
      loadedRows
        .filter(r=>r?.id)
        .map(r=>[String(r.id),r])
    );

    const unresolved=chunk.filter(id=>{
      const r=byId.get(String(id));
      return !r ||
        !r.data ||
        typeof r.data!=='object' ||
        !!r.data.__drive_ref;
    });

    // Intento 2: detalle individual/batch para cualquier registro incompleto.
    if(unresolved.length){
      try{
        const fallback=await detailMany(
          'clients',
          unresolved,
          ['id','name','rut','data'],
          {timeout:30000,attempts:2,signal}
        );

        for(const r of (fallback||[])){
          if(!r?.id)continue;
          byId.set(String(r.id),r);
        }

        loadedRows=[...byId.values()];
      }catch(e){
        if(isAbortError(e))throw e;
      }
    }

    const loadedIds=new Set();

    for(const r of loadedRows){
      if(!r?.id)continue;
      const id=String(r.id);
      const hasResolvedData=!!(
        r.data &&
        typeof r.data==='object' &&
        !r.data.__drive_ref
      );

      if(hasResolvedData){
        loadedIds.add(id);
        OT_BILLING_REQ_CHECKED.add(id);
        OT_BILLING_REQ_FAILED.delete(id);
        ERP.store.clientDetails.set(id,r);
      }
    }

    if(loadedRows.length){
      mergeClientRefs(loadedRows);

      const map=new Map((ERP.store.clients||[]).map(c=>[String(c.id),c]));
      for(const r of loadedRows){
        if(!r?.id)continue;
        const id=String(r.id);
        const current=map.get(id)||normalizeClient(r);

        const hasResolvedData=!!(
          r.data &&
          typeof r.data==='object' &&
          !r.data.__drive_ref
        );

        map.set(id,normalizeClient({
          ...current,
          name:text(r.name)||current.name,
          rut:text(r.rut)||current.rut,
          data:hasResolvedData?r.data:current.data
        }));
      }
      ERP.store.clients=[...map.values()];
      rebuildMaps();
    }

    // Solo después de ambos intentos marcamos los fallidos.
    for(const id of chunk){
      if(loadedIds.has(String(id)))continue;
      OT_BILLING_REQ_CHECKED.add(String(id));
      OT_BILLING_REQ_FAILED.add(String(id));
    }
  }
}

function otMatchesSearch(o,q){if(!q)return true;return norm([o.numero,o.descripcion,o.oc,o.hes,o.guia,o.factura,o.data?.numeroCotizacion,o.data?.quoteNumber,clientFor(o.clientId)?.name,clientFor(o.clientId)?.rut,quoteFor(o.quoteId)?.numero].join(' ')).includes(q)}

async function ensureOTPage(force=false,opts={}){
  const ui=ERP.ui.ots,
        r=ERP.remote.ots,
        filter=ui.filter||'pendientes',
        page=Math.max(1,ui.page||1),
        search=norm(ui.search),
        requestKey=`${filter}|${page}|${search}`,
        key=otScanKey(filter,search),
        signal=opts.signal||null;

  if(force)r.scans.delete(key);

  let scan=r.scans.get(key);
  if(!scan){
    scan=loadOTViewSnap(key);
    if(scan)r.scans.set(key,scan);
  }
  if(!scan){
    scan={items:[],seen:new Set(),sourceOffset:0,sourceTotal:null,exhausted:false,ts:0};
    r.scans.set(key,scan);
  }

  const needed=page*PAGE_SIZE;

  if(
    !force &&
    Date.now()-Number(scan.ts||0)<OT_VIEW_FRESH &&
    (scan.items.length>=needed||scan.exhausted) &&
    !((filter==='facturar'||filter==='listas')&&scan.items.length===0)
  ){
    const start=(page-1)*PAGE_SIZE,
          pageRows=scan.items.slice(start,start+PAGE_SIZE);

    if(otCurrentUiKey()===requestKey){
      r.currentRows=pageRows;
      r.hasMore=scan.items.length>start+PAGE_SIZE||!scan.exhausted;
      r.currentKnownTotal=scan.exhausted?scan.items.length:null;
    }
    return pageRows;
  }

  const refs=search?await otSearchRefs(search):{clientIds:[],quoteIds:[]};
  if(signal?.aborted)throw abortError();

  const coarse=otCoarseQuery(filter);
  const or=(coarse.orGroups||[]).slice();

  if(search){
    or.push([
      {column:'numero_ot',op:'ilike',value:search},
      {column:'descripcion',op:'ilike',value:search},
      {column:'oc',op:'ilike',value:search},
      {column:'hes',op:'ilike',value:search},
      {column:'guia_despacho',op:'ilike',value:search},
      ...(refs.clientIds.length?[{column:'client_id',op:'in',value:refs.clientIds}]:[]),
      ...(refs.quoteIds.length?[{column:'quote_id',op:'in',value:refs.quoteIds}]:[])
    ]);
  }

  const billingSensitive=filter==='facturar'||filter==='listas';
  const chunkLimit=billingSensitive?80:OT_SCAN_CHUNK;
  const maxPasses=billingSensitive?30:3;

  let passes=0;

  while(scan.items.length<needed&&!scan.exhausted&&passes<maxPasses){
    passes++;
    if(signal?.aborted)throw abortError();

    const j=await api('select',{
      table:'ots',
      columns:OT_PAGE_COLUMNS,
      filters:coarse.filters||[],
      orGroups:or,
      order:{column:'fecha',ascending:false},
      offset:scan.sourceOffset,
      limit:chunkLimit,
      resolveOverflow:false
    },{
      timeout:billingSensitive?30000:18000,
      attempts:billingSensitive?2:1,
      signal
    });

    let chunk=(j.data||[]).map(normalizeOT);

    scan.sourceTotal=Number.isFinite(Number(j.count))?Number(j.count):null;
    scan.sourceOffset+=chunk.length;

    if(
      !chunk.length ||
      (scan.sourceTotal!=null&&scan.sourceOffset>=scan.sourceTotal) ||
      chunk.length<chunkLimit
    ){
      scan.exhausted=true;
    }

    if(filter==='facturar'||filter==='listas'||filter==='activas'){
      chunk=await hydrateOTChunkForClassification(chunk,signal);
    }

    chunk=await enrichOTChunk(chunk,{
      billing:filter==='listas'||filter==='facturar'||filter==='activas'||filter==='activas_base',
      signal
    });

    for(const o of chunk){
      if(signal?.aborted)throw abortError();
      if(scan.seen.has(String(o.id)))continue;

      const group=otGroup(o);

      if(filter==='activas_base'){
        if(!['pendientes','curso'].includes(group))continue;
      }else if(filter==='activas'){
        if(!['pendientes','curso','listas'].includes(group))continue;
      }else if(filter!=='todas'&&group!==filter){
        continue;
      }

      const linkedRefMatch=search&&(
        refs.clientIds.includes(String(o.clientId)) ||
        refs.quoteIds.includes(String(o.quoteId))
      );

      if(search&&!linkedRefMatch&&!otMatchesSearch(o,search))continue;

      scan.seen.add(String(o.id));
      scan.items.push(o);
    }

    scan.ts=Date.now();
    saveOTViewSnap(key,scan);

    // Mostrar progresivamente las OT válidas ya encontradas.
    if(otCurrentUiKey()===requestKey&&scan.items.length){
      const previewStart=(page-1)*PAGE_SIZE;
      r.currentRows=scan.items.slice(previewStart,previewStart+PAGE_SIZE);
      r.hasMore=scan.items.length>previewStart+PAGE_SIZE||!scan.exhausted;
      r.currentKnownTotal=scan.exhausted?scan.items.length:null;
      mergeOTPageRows(r.currentRows);
      if(ERP.view==='ots')renderOTs();
    }
  }

  const start=(page-1)*PAGE_SIZE,
        pageRows=scan.items.slice(start,start+PAGE_SIZE);

  mergeOTPageRows(pageRows);

  if(otCurrentUiKey()===requestKey){
    r.currentRows=pageRows;
    r.hasMore=scan.items.length>start+PAGE_SIZE||!scan.exhausted;
    r.currentKnownTotal=scan.exhausted?scan.items.length:null;
  }

  return pageRows;

async function loadLinkedOTRefsForQuotes(rows){
  const quoteIds=[...new Set((rows||[]).map(q=>String(q?.id||'')).filter(Boolean))];
  const missing=quoteIds.filter(id=>!ERP.store.quoteOTRefs.has(id));
  if(!missing.length)return;

  for(let i=0;i<missing.length;i+=40){
    const chunk=missing.slice(i,i+40);
    chunk.forEach(id=>ERP.store.quoteOTRefs.set(id,[]));
    try{
      const j=await api('select',{
        table:'ots',
        columns:['id','numero_ot','quote_id','estado','fecha'],
        filters:[{column:'quote_id',op:'in',value:chunk}],
        orGroups:[],
        order:{column:'fecha',ascending:false},
        offset:0,
        limit:null,
        resolveOverflow:false
      },{timeout:22000,attempts:2});

      const grouped=new Map(chunk.map(id=>[String(id),[]]));
      for(const raw of (j.data||[])){
        const qid=String(raw.quote_id||'');
        if(!qid||!grouped.has(qid))continue;
        grouped.get(qid).push({
          id:String(raw.id||''),
          numero:text(raw.numero_ot),
          estado:text(raw.estado),
          fecha:raw.fecha||''
        });
      }
      for(const [qid,list] of grouped)ERP.store.quoteOTRefs.set(qid,list);
    }catch(e){
      // La cotización sigue visible aunque la consulta de OT se demore.
    }
  }
}

const OT_STATUS_SAVE_LOCKS=new Set();

function otApplyLocalStatus(id,status,pagoEstado=null){
  const key=String(id),pos=ERP.store.ots.findIndex(o=>String(o.id)===key);
  let current=pos>=0?ERP.store.ots[pos]:null;
  if(!current){
    const raw=localOTRaw(key);
    if(raw)current=normalizeOT(raw);
  }
  if(!current)return null;

  const nextPago=pagoEstado!==null?pagoEstado:otDerivedBillingState(current,status);
  const updated={...current,estado:status,pagoEstado:nextPago};

  if(updated.data&&typeof updated.data==='object'){
    updated.data={...updated.data,estado:status,pago_estado:nextPago};
  }

  if(pos>=0)ERP.store.ots[pos]=updated;
  else ERP.store.ots.push(updated);

  const detail=ERP.store.otDetails.get(key);
  if(detail){
    ERP.store.otDetails.set(key,{
      ...detail,
      estado:status,
      pago_estado:nextPago,
      data:{
        ...((detail.data&&typeof detail.data==='object')?detail.data:{}),
        estado:status,
        pago_estado:nextPago
      }
    });
  }

  return updated;
}

function otRefreshCurrentViewLocal(){
  const ui=ERP.ui.ots,r=ERP.remote.ots;
  if(ui.filter==='finalizadas'){
    applyFinalizedOTRows();
  }else{
    const all=localOTPreview(ui.search,ui.filter);
    const start=(Math.max(1,ui.page||1)-1)*PAGE_SIZE;
    r.currentRows=all.slice(start,start+PAGE_SIZE);
    r.currentKnownTotal=all.length;
    r.hasMore=all.length>start+PAGE_SIZE;
  }
  if(ERP.view==='ots')renderOTs();
}

async function markOTWorkDone(id,trigger=null){
  const key=String(id||'');
  if(!key||OT_STATUS_SAVE_LOCKS.has(key))return;

  const btn=trigger||null;
  const oldText=btn?.innerHTML;
  const rawLocal=ERP.store.otDetails.get(key)||localOTRaw(key);
  if(!rawLocal){
    alert('No se encontró la OT.');
    return;
  }

  const original=normalizeOT(rawLocal);
  const originalFilter=ERP.ui.ots.filter;
  const previousStatus=original.estado||'';
  const previousPago=original.pagoEstado||'';

  OT_STATUS_SAVE_LOCKS.add(key);

  // 1) Reacción inmediata.
  let optimisticPago=otDerivedBillingState({...original,estado:'trabajo listo'},'trabajo listo');
  let optimistic=otApplyLocalStatus(key,'trabajo listo',optimisticPago);
  const optimisticTarget=otIsReadyToInvoice(optimistic)?'facturar':'listas';

  ERP.ui.ots.filter=optimisticTarget;
  ERP.ui.ots.page=1;
  closeModal();
  otRefreshCurrentViewLocal();

  try{
    if(btn){
      btn.disabled=true;
      btn.innerHTML='Guardando…';
    }

    // 2) Completar requisitos del cliente en segundo plano, sin bloquear la UI.
    if(original.clientId){
      try{await loadClientBillingData([original.clientId])}catch(e){}
    }

    const full=ERP.store.otDetails.get(key)||rawLocal;
    const current=normalizeOT(full);
    const base=(full?.data&&typeof full.data==='object')?full.data:{};
    const history=Array.isArray(base.otHistory)?base.otHistory.slice():[];
    const finalPago=otDerivedBillingState({...current,estado:'trabajo listo'},'trabajo listo');

    history.unshift(
      otHistoryEntry('Trabajo marcado como realizado',{
        fromStatus:previousStatus,
        toStatus:'trabajo listo',
        pago_estado:finalPago,
        fechaRealizacion:isoToday()
      })
    );

    const data={
      ...base,
      estado:'trabajo listo',
      pago_estado:finalPago,
      fechaRealizacion:isoToday(),
      trabajoRealizado:true,
      trabajo_realizado:true,
      otHistory:history
    };

    const patch={
      estado:'trabajo listo',
      pago_estado:finalPago,
      data
    };

    // Ajustar la vista local si el requisito documental cambió el destino.
    const localUpdated=otApplyLocalStatus(key,'trabajo listo',finalPago);
    const finalTarget=otIsReadyToInvoice(localUpdated)?'facturar':'listas';
    if(ERP.ui.ots.filter!==finalTarget){
      ERP.ui.ots.filter=finalTarget;
      ERP.ui.ots.page=1;
    }
    otRefreshCurrentViewLocal();

    await api('update',{
      table:'ots',
      patch,
      filters:[{column:'id',op:'eq',value:key}]
    },{timeout:60000,attempts:2});

    const saved={...full,...patch};
    ERP.store.otDetails.set(key,saved);
    const pos=ERP.store.ots.findIndex(o=>String(o.id)===key);
    if(pos>=0)ERP.store.ots[pos]=normalizeOT({...ERP.store.ots[pos],...saved});

    ERP.state.ots.error='';
    ERP.state.ots.last=Date.now();

    // Confirmación silenciosa contra servidor, sin bloquear la pantalla.
    setTimeout(()=>{
      if(ERP.view==='ots')showOTs(false).catch(()=>{});
    },150);
  }catch(e){
    // Revertir si el servidor realmente rechazó el cambio.
    otApplyLocalStatus(key,previousStatus,previousPago);
    ERP.ui.ots.filter=originalFilter;
    ERP.ui.ots.page=1;
    otRefreshCurrentViewLocal();
    alert('No se pudo marcar el trabajo como realizado: '+(e?.message||e));
  }finally{
    OT_STATUS_SAVE_LOCKS.delete(key);
    if(btn){
      btn.disabled=false;
      btn.innerHTML=oldText||'Marcar trabajo realizado';
    }
  }
}

async function setOTStatus(id,status,trigger=null){
  const key=String(id||'');
  if(!key||OT_STATUS_SAVE_LOCKS.has(key))return;

  if(statusNorm(status).includes('pendiente factur'))status='trabajo listo';

  const rawLocal=ERP.store.otDetails.get(key)||localOTRaw(key);
  if(!rawLocal){
    alert('No se encontró la OT.');
    return;
  }

  const current=normalizeOT(rawLocal);
  const previousStatus=current.estado||'';
  const previousPago=current.pagoEstado||'';
  const previousFilter=ERP.ui.ots.filter;
  const nextPago=otDerivedBillingState({...current,estado:status},status);

  OT_STATUS_SAVE_LOCKS.add(key);

  // Cambio visual inmediato.
  otApplyLocalStatus(key,status,nextPago);
  closeModal();
  otRefreshCurrentViewLocal();

  const btn=trigger||null;
  const oldText=btn?.innerHTML;

  try{
    if(btn){
      btn.disabled=true;
      btn.innerHTML='Guardando…';
    }

    const full=ERP.store.otDetails.get(key)||rawLocal;
    const base=(full?.data&&typeof full.data==='object')?full.data:{};
    const history=Array.isArray(base.otHistory)?base.otHistory.slice():[];

    history.unshift(
      otHistoryEntry(`Estado del trabajo cambiado a ${status}`,{
        fromStatus:previousStatus,
        toStatus:status,
        pago_estado:nextPago
      })
    );

    const data={
      ...base,
      estado:status,
      pago_estado:nextPago,
      otHistory:history
    };

    const patch={
      estado:status,
      pago_estado:nextPago,
      data
    };

    await api('update',{
      table:'ots',
      patch,
      filters:[{column:'id',op:'eq',value:key}]
    },{timeout:60000,attempts:2});

    const saved={...full,...patch};
    ERP.store.otDetails.set(key,saved);
    const pos=ERP.store.ots.findIndex(o=>String(o.id)===key);
    if(pos>=0)ERP.store.ots[pos]=normalizeOT({...ERP.store.ots[pos],...saved});

    ERP.state.ots.error='';
    ERP.state.ots.last=Date.now();

    // Sincronizar en segundo plano, conservando la vista visible.
    setTimeout(()=>{
      if(ERP.view==='ots')showOTs(false).catch(()=>{});
    },150);
  }catch(err){
    otApplyLocalStatus(key,previousStatus,previousPago);
    ERP.ui.ots.filter=previousFilter;
    ERP.ui.ots.page=1;
    otRefreshCurrentViewLocal();
    alert('No se pudo cambiar el estado: '+(err?.message||err));
  }finally{
    OT_STATUS_SAVE_LOCKS.delete(key);
    if(btn){
      btn.disabled=false;
      btn.innerHTML=oldText||'Guardar';
    }
  }
}

function billingLegacyPaidOT(o){
  const d=(o&&o.data&&typeof o.data==='object')?o.data:{};
  const state=norm(
    o?.pagoEstado||o?.pago_estado||o?.cobro_estado||
    d.pago_estado||d.cobro_estado||''
  );
  if(['pagado','pagada','paid'].includes(state))return true;
  if(d.pagoConfirmado===true||d.pago_confirmado===true)return true;
  if(
    o?.pagoFecha||o?.fechaPago||
    d.fechaPagoISO||d.fechaPago||
    d.pagoFechaISO||d.pagoFecha||
    d.fecha_pago||d.pago_fecha
  )return true;
  return false;

async function loadBillingExact(force=false){
  if(ERP._billingExactPromise&&!force)return ERP._billingExactPromise;
  if(!force&&ERP._billingExactLoadedAt&&Date.now()-ERP._billingExactLoadedAt<45000&&billingRowSource().length){
    return billingRowSource();
  }

  ERP._billingExactPromise=(async()=>{
    const st=ERP.state.billing;
    try{
      const j=await api('select',{
        table:'ots',
        filters:[],
        orGroups:[],
        order:{column:'created_at',ascending:false},
        offset:0,
        limit:null,
        columns:BILLING_HISTORY_COLUMNS,
        resolveOverflow:true
      },{timeout:60000,attempts:1});

      const rawRows=Array.isArray(j?.data)?j.data:[];
      let legacyPayments=[];
      try{
        const payRes=await api('select',{
          table:'payments',
          filters:[],
          orGroups:[],
          order:{column:'created_at',ascending:false},
          offset:0,
          limit:null,
          columns:['id','ot_id','monto','data','created_by_name','created_by_email','created_at'],
          resolveOverflow:true
        },{timeout:45000,attempts:1});
        legacyPayments=(payRes?.data||[])
          .map(normalizeLegacyPaymentRow)
          .filter(Boolean)
          .map(p=>({...p,__legacyNormalized:true}));
      }catch(_paymentsError){
        legacyPayments=[];
      }
      ERP.store.billingLegacyPayments=legacyPayments;

      const exact=rawRows
        .map(normalizeOT)
        .filter(o=>o?.id&&docsFromOT(o).length);

      // IMPORTANTE: esta colección reemplaza la vista parcial.
      // Facturación representa todos los documentos emitidos, pagados o no.
      ERP.store.billingRows=exact;

      for(const raw of rawRows){
        if(!raw?.id)continue;
        ERP.store.otDetails.set(String(raw.id),raw);
      }

      // Mantener también la colección OT enriquecida con los datos recién leídos,
      // sin cambiar filtros ni navegación del módulo OT.
      const byId=new Map((ERP.store.ots||[]).map(o=>[String(o.id),o]));
      for(const o of exact){
        const current=byId.get(String(o.id));
        if(current)Object.assign(current,o);
      }

      try{await loadVisibleClientRefs(exact)}catch(e){}

      try{
        saveSnap('billing',exact.map(o=>({
          ...o,
          numero_ot:o.numero,
          quote_id:o.quoteId,
          client_id:o.clientId,
          pago_estado:o.pagoEstado
        })));
      }catch(e){}

      st.loaded=true;
      st.last=Date.now();
      st.error='';
      ERP._billingExactLoadedAt=Date.now();
      ERP._billingHistoryComplete=true;
      ERP._billingHistoryProgress={offset:rawRows.length,total:rawRows.length};
      return exact;
    }catch(e){
      st.error=e?.message||String(e);
      if(billingRowSource().length)return billingRowSource();
      throw e;
    }finally{
      ERP._billingExactPromise=null;
      billingUpdateHistoryStatus();
      if(ERP.view==='billing')renderBilling();
    }
  })();

  return ERP._billingExactPromise;
}

async function syncLinkedOTsFromQuote(quoteId,payload){
  const qid=String(quoteId||'');
  if(!qid)return {updated:0,errors:[]};

  let rawRows=[];
  try{
    const j=await api('select',{
      table:'ots',
      columns:OT_DETAIL_COLUMNS,
      filters:[{column:'quote_id',op:'eq',value:qid}],
      orGroups:[],
      order:{column:'created_at',ascending:false},
      offset:0,
      limit:null,
      resolveOverflow:true
    },{timeout:45000,attempts:2});
    rawRows=Array.isArray(j?.data)?j.data:[];
  }catch(e){
    // Si el servidor falla, usar las OT enlazadas que ya estén en memoria.
    const local=(ERP.store.ots||[]).filter(o=>String(o.quoteId)===qid);
    rawRows=local.map(o=>localOTRaw(o.id)).filter(Boolean);
    if(!rawRows.length)throw e;
  }

  if(!rawRows.length){
    try{
      const all=await api('select',{
        table:'ots',
        columns:['id','quote_id','client_id','numero_ot','descripcion','monto','data'],
        filters:[],
        orGroups:[],
        order:{column:'created_at',ascending:false},
        offset:0,
        limit:null,
        resolveOverflow:true
      },{timeout:60000,attempts:2});

      rawRows=(all?.data||[]).filter(r=>{
        const d=(r?.data&&typeof r.data==='object')?r.data:{};
        return String(r.quote_id||d.quote_id||d.quoteId||'')===qid ||
          String(d.numeroCotizacion||'')===String(payload.numero||'');
      });
    }catch(e){}
  }

  if(!rawRows.length)return {updated:0,errors:[]};

  const qd=(payload?.data&&typeof payload.data==='object')?payload.data:{};
  const client=clientFor(payload.client_id);
  const errors=[];
  let updatedCount=0;

  for(const raw of rawRows){
    try{
      const current=normalizeOT(raw);
      const base=(raw?.data&&typeof raw.data==='object')?raw.data:{};
      const hist=Array.isArray(base.otHistory)?base.otHistory.slice():[];

      hist.unshift(otHistoryEntry('Datos comerciales sincronizados desde cotización',{
        quote_id:qid,
        numeroCotizacion:payload.numero,
        monto:payload.monto
      }));

      const data={
        ...base,

        // vínculo comercial
        source:'quote',
        quote_id:qid,
        quoteId:qid,
        numeroCotizacion:payload.numero,

        // cliente
        client_id:payload.client_id,
        clientId:payload.client_id,
        clientName:client?.name||qd.clientName||base.clientName||'',
        razonSocial:client?.name||qd.razonSocial||base.razonSocial||'',
        rut:client?.rut||qd.rut||base.rut||'',

        // información comercial actualizada
        descripcion:payload.descripcion||payload.obra||base.descripcion||'',
        obra:payload.obra||payload.descripcion||base.obra||'',
        tipo_servicio:payload.tipo_servicio||qd.tipo_servicio||base.tipo_servicio||'',
        branchAlias:qd.branchAlias||qd.siteAlias||base.branchAlias||base.siteAlias||'',
        siteAlias:qd.siteAlias||qd.branchAlias||base.siteAlias||base.branchAlias||'',
        sucursal:qd.sucursal||qd.branchAlias||qd.direccion||base.sucursal||'',
        direccion:qd.direccion||base.direccion||'',
        items:Array.isArray(payload.items)?payload.items:(Array.isArray(qd.items)?qd.items:base.items),

        // valores
        bruto:num(payload.bruto),
        descuento_pct:num(payload.descuento_pct),
        descuento_monto:num(payload.descuento_monto),
        neto:num(payload.neto),
        iva:num(payload.iva),
        monto:num(payload.monto),
        total:num(payload.monto),

        cotizacionActualizadaEn:new Date().toISOString(),
        otHistory:hist
      };

      const patch={
        quote_id:qid,
        client_id:payload.client_id,
        descripcion:payload.descripcion||payload.obra||current.descripcion,
        data
      };

      await api('update',{
        table:'ots',
        patch,
        filters:[{column:'id',op:'eq',value:raw.id}]
      },{timeout:60000,attempts:2});

      const updated={...raw,...patch,id:raw.id,data:{...data,monto:num(payload.monto),total:num(payload.monto)}};
      ERP.store.otDetails.set(String(raw.id),updated);

      const pos=ERP.store.ots.findIndex(o=>String(o.id)===String(raw.id));
      if(pos>=0)ERP.store.ots[pos]=normalizeOT({...ERP.store.ots[pos],...updated});

      if(Array.isArray(ERP.store.billingRows)){
        const bi=ERP.store.billingRows.findIndex(o=>String(o.id)===String(raw.id));
        if(bi>=0)ERP.store.billingRows[bi]=normalizeOT({...ERP.store.billingRows[bi],...updated});
      }

      updatedCount++;
    }catch(e){
      errors.push(e?.message||String(e));
    }
  }

  // Vaciar únicamente las vistas derivadas, no los datos principales.
  ERP.remote.ots.scans.clear();
  ERP.remote.ots.currentRows=[];
  ERP.remote.ots.currentKnownTotal=null;
  ERP.remote.ots.hasMore=false;
  try{
    Object.keys(localStorage)
      .filter(k=>k.startsWith(OT_VIEW_CACHE_PREFIX))
      .forEach(k=>localStorage.removeItem(k));
  }catch(e){}

  invalidate('ots');
  invalidate('billing');
  try{localStorage.removeItem(SNAP_PREFIX+'ots')}catch(e){}
  try{localStorage.removeItem(SNAP_PREFIX+'billing')}catch(e){}

  return {updated:updatedCount,errors};
}

function otBillingSituationHtml(o){
  const view=otBillingView(o),docs=docsFromOT(view);

  if(docs.length){
    const d=docs[docs.length-1];
    return `<button class="ot-doc-existing" onclick="ERP.otTaxDocumentFlow('${esc(view.id)}')">${esc(d.tipo==='boleta'?'Boleta':'Factura')} ${esc(d.numero)}</button>`;
  }

  if(!otIsWorkCompleted(view))return 'Aún no corresponde';

  const state=otBillingRequirementState(view);
  if(!state.loaded)return '<span class="badge b-neutral">Verificando requisitos…</span>';
  if(state.failed)return '<span class="badge b-neutral">Requisitos no disponibles</span>';
  if(!state.configured)return '<span class="badge b-neutral">Documentación por definir</span>';

  if(state.missing.length){
    const label=state.missing.length===2?'OC y HES pendientes':`${state.missing[0]} pendiente`;
    return `<span class="badge b-pending">${label}</span>`;
  }

  if(state.noDocumentation){
    return `<button class="ot-doc-action" onclick="ERP.otTaxDocumentFlow('${esc(view.id)}')">Sin documentación requerida</button>`;
  }

async function reconcileLinkedOTAmount(raw){
  if(!raw)return raw;
  const o=normalizeOT(raw);
  if(!o.quoteId)return raw;

  let q=null;
  try{
    const qr=await detail('quotes',o.quoteId,[
      'id','client_id','numero','monto','descripcion','obra','fecha','estado',
      'tipo_servicio','sucursal','direccion','bruto','descuento_pct',
      'descuento_monto','neto','iva','items','data'
    ],{timeout:45000,attempts:2});
    if(qr){
      q=normalizeQuote(qr);

      // Refrescar de inmediato todas las copias locales de la cotización.
      const qi=ERP.store.quotes.findIndex(x=>String(x.id)===String(q.id));
      if(qi>=0)ERP.store.quotes[qi]=q;
      else ERP.store.quotes.push(q);

      ERP.store.quoteRefs.set(String(q.id),{
        id:q.id,
        numero:q.numero,
        clientId:q.clientId,
        monto:q.monto
      });
      rebuildMaps();
    }
  }catch(e){
    q=quoteFor(o.quoteId);
  }

  if(!q||num(q.monto)<=0)return raw;

  const targetAmount=num(q.monto);
  const base=(raw.data&&typeof raw.data==='object')?raw.data:{};
  const nextData={
    ...base,
    quote_id:o.quoteId,
    quoteId:o.quoteId,
    numeroCotizacion:q.numero||base.numeroCotizacion||'',
    monto:targetAmount,
    total:targetAmount,
    bruto:num(q.bruto||base.bruto),
    neto:num(q.neto||base.neto),
    iva:num(q.iva||base.iva),
    descuento_pct:num(q.descuentoPct||base.descuento_pct),
    descripcion:q.descripcion||q.obra||base.descripcion||o.descripcion||'',
    obra:q.obra||q.descripcion||base.obra||'',
    tipo_servicio:q.tipo||base.tipo_servicio||'',
    sucursal:q.sucursal||base.sucursal||'',
    direccion:q.direccion||base.direccion||'',
    items:Array.isArray(q.items)&&q.items.length?q.items:base.items,
    cotizacionSincronizadaEn:new Date().toISOString()
  };

  // Si ya coincide, igual devolvemos la versión reconciliada para la vista.
  if(Math.abs(targetAmount-num(o.monto))<0.5 && Math.abs(targetAmount-num(base.monto||base.total))<0.5){
    return {...raw,monto:targetAmount,data:nextData};
  }

  const patch={
    quote_id:o.quoteId,
    client_id:q.clientId||o.clientId,
    descripcion:q.descripcion||q.obra||o.descripcion,
    data:nextData
  };

  try{
    await api('update',{
      table:'ots',
      patch,
      filters:[{column:'id',op:'eq',value:raw.id}]
    },{timeout:60000,attempts:2});
  }catch(e){
    // Si la escritura remota falla, mantenemos la vista actualizada
    // con la cotización y no intentamos una columna inexistente.
  }

  const updated={...raw,...patch,monto:targetAmount,data:nextData};
  ERP.store.otDetails.set(String(raw.id),updated);

  const pos=ERP.store.ots.findIndex(x=>String(x.id)===String(raw.id));
  if(pos>=0)ERP.store.ots[pos]=normalizeOT({...ERP.store.ots[pos],...updated});

  // Aunque el backend tarde en reflejar el cambio, la OT usa desde ya
  // el valor vigente de la cotización vinculada.
  return updated;
}

async function fetchAllLight(table,columns,filters=[],orGroups=[]){const out=[],seen=new Set();let offset=0,total=null;const limit=80;for(let guard=0;guard<40;guard++){const j=await api('select',{table,columns,filters,orGroups,order:{column:'created_at',ascending:false},offset,limit,resolveOverflow:false},{timeout:35000,attempts:1});const batch=Array.isArray(j.data)?j.data:[];if(total===null&&Number.isFinite(Number(j.count)))total=Number(j.count);if(!batch.length)break;let added=0;for(const r of batch){const key=String(r.id||`${table}-${offset+added}`);if(seen.has(key))continue;seen.add(key);out.push(r);added++}offset+=batch.length;if(total!==null&&offset>=total)break;if(added===0)break}return out}

async function fetchAllOTDetailsForReport(){
  const out=[],seen=new Set();
  let offset=0,total=null;
  const limit=60;
  for(let guard=0;guard<80;guard++){
    const j=await api('select',{
      table:'ots',
      columns:BILLING_HISTORY_COLUMNS,
      filters:[],
      orGroups:[],
      order:{column:'created_at',ascending:false},
      offset,
      limit,
      resolveOverflow:true
    },{timeout:50000,attempts:1});
    const batch=Array.isArray(j?.data)?j.data:[];
    if(total===null&&Number.isFinite(Number(j?.count)))total=Number(j.count);
    if(!batch.length)break;
    let added=0;
    for(const r of batch){
      const key=String(r?.id||'');
      if(key&&seen.has(key))continue;
      if(key)seen.add(key);
      out.push(r);
      added++;
    }
    offset+=batch.length;
    if(total!==null&&offset>=total)break;
    if(added===0)break;
  }
  return out;
}

function otReportCompletionDate(o){
  const d=(o?.data&&typeof o.data==='object')?o.data:{};
  const history=Array.isArray(d.otHistory)?d.otHistory:[];
  const hits=history.filter(h=>{
    const to=statusNorm(h?.toStatus||h?.estado||'');
    const action=norm(h?.action||h?.accion||'');
    return to.includes('trabajo listo')||
      to.includes('realiz')||
      to.includes('termin')||
      to.includes('complet')||
      action.includes('trabajo listo')||
      action.includes('realiz')||
      action.includes('termin')||
      action.includes('complet');
  }).map(h=>h?.date||h?.fecha||h?.createdAt||h?.created_at).filter(Boolean);

  if(hits.length){
    hits.sort((a,b)=>{
      const ad=billingParseFlexibleDate(a),bd=billingParseFlexibleDate(b);
      return (bd?.getTime()||0)-(ad?.getTime()||0);
    });
    return hits[0];
  }

  // Si ya existe documento tributario, su fecha es un respaldo válido
  // para trabajos antiguos que no tenían historial de estados.
  const docs=docsFromOT(o);
  if(docs.length){
    const docDates=docs.map(doc=>billingDocDate(doc,o)).filter(Boolean);
    if(docDates.length){
      docDates.sort((a,b)=>{
        const ad=billingParseFlexibleDate(a),bd=billingParseFlexibleDate(b);
        return (ad?.getTime()||0)-(bd?.getTime()||0);
      });
      return docDates[0];
    }
  }

  return o?.fecha||o?.createdAt||'';
}

function otReportDocumentLabel(o){
  const docs=docsFromOT(o).filter(d=>!d.anulada);
  if(!docs.length)return 'Sin factura';
  return docs.map(d=>`${d.tipo==='boleta'?'Boleta':'Factura'} ${d.numero}`).join(' / ');
}

async function downloadCompletedOTsPDF(){
  const btn=$('pdfCompletedOTBtn');
  const old=btn?.textContent;
  try{
    const month=Number($('pdfWorkMonth')?.value||0);
    const year=Number($('pdfWorkYear')?.value||0);
    if(!month||!year)throw new Error('Selecciona mes y año.');

    if(btn){btn.disabled=true;btn.textContent='Preparando…'}
    await ensurePdfTableLibs();

    let raw;
    try{
      raw=await fetchAllOTDetailsForReport();
    }catch(e){
      raw=(ERP.store.ots||[]).map(o=>({
        ...o,
        numero_ot:o.numero,
        client_id:o.clientId,
        quote_id:o.quoteId,
        pago_estado:o.pagoEstado,
        data:o.data
      }));
    }

    const normalized=raw.map(normalizeOT);
    await hydratePdfClientRefs(raw);

    const rows=normalized
      .map(o=>({o,date:otReportCompletionDate(o)}))
      .filter(x=>{
        const o=x.o;
        const pay=statusNorm(o?.pagoEstado);
        const completed=otIsWorkCompleted(o)||
          docsFromOT(o).length>0||
          pay.includes('factur')||
          pay.includes('pag')||
          pay.includes('parcial');
        if(!completed)return false;
        const d=billingParseFlexibleDate(x.date);
        return !!d&&d.getFullYear()===year&&(d.getMonth()+1)===month;
      })
      .sort((a,b)=>{
        const ad=billingParseFlexibleDate(a.date),bd=billingParseFlexibleDate(b.date);
        return (ad?.getTime()||0)-(bd?.getTime()||0)||
          String(a.o.numero||'').localeCompare(String(b.o.numero||''),'es',{numeric:true});
      });

    const monthNames=['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    if(!rows.length)throw new Error(`No hay trabajos realizados registrados en ${monthNames[month]} ${year}.`);

    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'landscape'});
    pdfReportHeader(
      pdf,
      `TRABAJOS REALIZADOS · ${monthNames[month].toUpperCase()} ${year}`,
      `${rows.length} trabajo(s) realizado(s)`
    );

    pdf.autoTable({
      startY:31,
      head:[['OT','Fecha realizada','Cliente','Trabajo','Estado','Documento']],
      body:rows.map(({o,date})=>[
        o.numero||'—',
        dateCL(date),
        clientFor(o.clientId)?.name||o.data?.clientName||'Cliente',
        o.descripcion||'—',
        docsFromOT(o).length?'Trabajo finalizado':'Trabajo listo',
        otReportDocumentLabel(o)
      ]),
      styles:{fontSize:8,cellPadding:2.2,valign:'top',overflow:'linebreak'},
      headStyles:{fillColor:[234,247,251],textColor:[16,61,94],fontStyle:'bold'},
      columnStyles:{
        0:{cellWidth:23},
        1:{cellWidth:28},
        2:{cellWidth:50},
        3:{cellWidth:105},
        4:{cellWidth:35},
        5:{cellWidth:43}
      },
      margin:{left:14,right:14}
    });

    pdf.save(`Trabajos_realizados_${String(month).padStart(2,'0')}_${year}.pdf`);
  }catch(e){
    alert('No se pudo generar el PDF de trabajos realizados: '+(e?.message||e));
  }finally{
    if(btn){btn.disabled=false;btn.textContent=old||'Descargar PDF mensual'}
  }
}

function showApp(){hydrateCachedStores();startupGraceUntil=Date.now()+STARTUP_GRACE_MS;$('loginScreen').classList.add('hidden');$('app').classList.remove('hidden');$('sideUserName').textContent=ERP.session?.user?.display_name||ERP.session?.user?.email||'Usuario';$('sideUserEmail').textContent=ERP.session?.user?.email||'';applyRoleNavigation();setContent(pageHeader('Cotizaciones','Seguimiento comercial desde el envío hasta la creación de la Orden de Trabajo.')+`<div class="panel"><div class="loading"><span class="spinner"></span>Preparando información…</div></div>`);requestAnimationFrame(()=>{if((ERP.store.quotes||[]).length){try{const ui=ERP.ui.quotes,r=ERP.remote.quotes,local=localQuotePreview(ui.search,ui.status),start=(Math.max(1,ui.page||1)-1)*PAGE_SIZE;r.currentRows=local.slice(start,start+PAGE_SIZE);r.currentTotal=local.length;r.currentKey=quotePageCacheKey(ui.status||'pendiente',Math.max(1,ui.page||1),norm(ui.search));renderQuotes()}catch(e){}}setTimeout(()=>openView('quotes'),120)});if(ERP.session?.user?.must_change_password&&!ERP._passwordPrompted){ERP._passwordPrompted=true;setTimeout(()=>changePasswordForm(true),700)}}
async function login(email,password){const j=await api('login',{email,password},{timeout:60000});const s={token:j.token,expires_at:j.expires_at,user:j.user};resetRuntimeState();saveSession(s);lastRefresh=Date.now();return s}
async function logout(){const token=text(ERP.session?.token);try{if(token)await api('logout',{}, {timeout:30000})}catch(e){}saveSession(null);resetRuntimeState();showLogin()}
let lastRefresh=0;async function refreshSession(force=false){if(!ERP.session?.token)return;if(!force&&Date.now()-lastRefresh<45*60*1000)return;const token=text(ERP.session.token);try{const j=await api('refresh_session',{}, {timeout:60000});if(text(ERP.session?.token)!==token)return;const next={...ERP.session,expires_at:j.expires_at,user:j.user||ERP.session.user};saveSession(next);lastRefresh=Date.now()}catch(e){}}



const MORE_TOOLS_KEY='ecoluz_erp_more_tools_open_v1';
const MORE_TOOL_VIEWS=new Set(['maintenance','clients','pdfs','users']);
let moreToolsOpen=false;
function applyMoreToolsState(open){
  moreToolsOpen=!!open;
  const wrap=document.querySelector('.nav-tools'),btn=$('moreToolsBtn');
  wrap?.classList.toggle('open',moreToolsOpen);
  if(btn)btn.setAttribute('aria-expanded',moreToolsOpen?'true':'false');
}
function toggleMoreTools(){
  applyMoreToolsState(!moreToolsOpen);
  try{localStorage.setItem(MORE_TOOLS_KEY,moreToolsOpen?'1':'0')}catch(e){}
}
function syncMoreToolsForView(view){
  const wrap=document.querySelector('.nav-tools');
  const inside=MORE_TOOL_VIEWS.has(view);
  wrap?.classList.toggle('has-active',inside);
  if(inside&&!moreToolsOpen)applyMoreToolsState(true);
}
function initMoreTools(){
  try{moreToolsOpen=localStorage.getItem(MORE_TOOLS_KEY)==='1'}catch(e){moreToolsOpen=false}
  applyMoreToolsState(moreToolsOpen);
}
const SIDEBAR_PIN_KEY='ecoluz_erp_sidebar_pinned_v1';
let sidebarPinned=false,sidebarCloseTimer=null;
function applySidebarState(collapsed){const app=$('app');if(!app)return;app.classList.toggle('sidebar-collapsed',!!collapsed);const btn=$('sidebarPinBtn');if(btn){btn.classList.toggle('pinned',sidebarPinned);btn.title=sidebarPinned?'Liberar menú':'Fijar menú';btn.setAttribute('aria-label',btn.title)}}
function setSidebarPinned(value){sidebarPinned=!!value;try{localStorage.setItem(SIDEBAR_PIN_KEY,sidebarPinned?'1':'0')}catch(e){};applySidebarState(!sidebarPinned)}
function initSidebarBehavior(){const side=document.querySelector('.sidebar'),btn=$('sidebarPinBtn');if(!side)return;try{sidebarPinned=localStorage.getItem(SIDEBAR_PIN_KEY)==='1'}catch(e){sidebarPinned=false}applySidebarState(!sidebarPinned);side.addEventListener('mouseenter',()=>{if(sidebarCloseTimer){clearTimeout(sidebarCloseTimer);sidebarCloseTimer=null}if(!sidebarPinned)applySidebarState(false)});side.addEventListener('mouseleave',()=>{if(sidebarPinned)return;if(sidebarCloseTimer)clearTimeout(sidebarCloseTimer);sidebarCloseTimer=setTimeout(()=>applySidebarState(true),450)});btn?.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();setSidebarPinned(!sidebarPinned)})}

 setQuoteStatus(v){ERP.ui.quotes.status=v;ERP.ui.quotes.page=1;showQuotes(false)},quotePage(p){ERP.ui.quotes.page=Math.max(1,p);showQuotes(false)},quoteSearchChanged,
